bundle:
  name: kpi-assessment

sync:
  include:
    - src/**
    - config/databricks.yml
    - requirements.txt
    - data/**

resources:
  jobs:
    kpi_de_pipeline:
      name: "KPI Assessment Pipeline - ${bundle.target}"

      email_notifications:
        on_failure:
          - "srath.dataenthusiast@gmail.com"

      tasks:
        - task_key: "run_ingest_transactions"
          # REMOVED: job_cluster_key - there is no cluster definition anymore
          spark_python_task:
            python_file: "src/kpi_assessment/ingestion/ingest_transactions.py"
            parameters: ["--environment", "databricks"]

          # This links the task to the serverless environment below
          environment_key: "default"

      # Define the serverless environment and its dependencies
      environments:
        - environment_key: "default"
          spec:
            client: "1"
            dependencies:
              - "PyYAML"
              - "pycountry"
              - "jsonschema"