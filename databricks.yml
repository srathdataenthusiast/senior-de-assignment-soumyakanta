bundle:
  name: kpi-assessment

sync:
  include:
    - src/**
    - config/databricks.yml
    - requirements.txt
    - data/**

resources:
  jobs:
    kpi_de_pipeline:
      name: "KPI Assessment Pipeline - ${bundle.target}"

      email_notifications:
        on_failure:
          - "srath.dataenthusiast@gmail.com"

      tasks:
        - task_key: "run_ingest_transactions"
          spark_python_task:
            python_file: "src/kpi_assessment/ingestion/ingest_transactions.py"
            parameters: ["--environment", "databricks"]

          environment_key: "default"

      environments:
        - environment_key: "default"
          spec:
            client: "1"
            dependencies:
              - "PyYAML"
              - "pycountry"
              - "jsonschema"
              - "python-dotenv"

# THE MISSING PIECE: Targets for Dev and Prod
targets:
  dev:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}