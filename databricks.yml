bundle:
  name: kpi-assessment

sync:
  include:
    - src/**
    - config/databricks.yml
    - requirements.txt
    - data/**

resources:
  jobs:
    kpi_de_pipeline:
      name: "KPI Assessment Pipeline - ${bundle.target}"

      # PRODUCTION SUPPORT: Email notification on failure
      email_notifications:
        on_failure:
          - "srath.dataenthusiast@gmail.com"

      tasks:
        - task_key: "run_ingest_transactions"
          # REMOVED: job_cluster_key: "de_cluster"

          spark_python_task:
            python_file: "src/kpi_assessment/ingestion/ingest_transactions.py"
            parameters: ["--environment", "databricks"]

          # NEW: Reference the serverless environment for dependencies
          environment_key: "default"

      # NEW: Define the serverless environment and its dependencies
      environments:
        - environment_key: "default"
          spec:
            client: "1"
            dependencies:
              - "PyYAML"
              - "pycountry"
              - "jsonschema"
              # Add any other packages from your requirements.txt here
              # (e.g., "delta-spark", "pyspark", etc.)
              # For a complete list, you can refer to your requirements.txt