name: Databricks Code Deployment

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Note: On PRs, this will default to 'dev'. If your 'dev' environment has a manual approval rule, the PR check will pause until approved.

    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_workspace_host: ${{ vars.DATABRICKS_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t "$BUNDLE_TARGET"
        env:
          BUNDLE_TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

      # THIS IS THE CRITICAL FIX: Only deploy on a push, NOT on a pull request
      - name: Deploy source code
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: databricks bundle deploy -t "$BUNDLE_TARGET"
        env:
          BUNDLE_TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
